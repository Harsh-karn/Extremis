version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mailforge-db
    environment:
      POSTGRES_USER: mailforge
      POSTGRES_PASSWORD: mailforgepassword
      POSTGRES_DB: mailforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mailforge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
